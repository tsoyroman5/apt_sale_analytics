name: apt_sale_data

profile: apt_sale_data

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  apt_sale_data:
    +schema: raw

vars:
  bulk_deal_min_group_size: 8  

models:
  apt_sale_data:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
