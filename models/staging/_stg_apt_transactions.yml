version: 2

models:
  - name: stg_apt_transactions
    columns:
      - name: transaction_id
        data_tests: [not_null, unique]
      - name: deal_group_key
        data_tests: [not_null]
      - name: deal_date
        data_tests: [not_null]
      - name: deal_amount_10k_krw
        data_tests: [not_null]
      - name: apartment_seq
        data_tests: [not_null]
      - name: district_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['11710', '11680', '11500', '11740', '11620']
