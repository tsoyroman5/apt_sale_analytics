version: 2

models:
  - name: dim_apartment
    columns:
      - name: apartment_seq
        data_tests: [not_null, unique]
  - name: dim_date
    columns:
      - name: date_day
        data_tests: [not_null, unique]
  - name: fact_apt_sales
    description: One row per reported sale record. Grain is a record, not a unit, because the source has no unit number.
    columns:
      - name: transaction_id
        data_tests: [not_null, unique]
      - name: is_bulk_deal
        data_tests: [not_null]
      - name: apartment_seq
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_apartment')
                field: apartment_seq
      - name: deal_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day